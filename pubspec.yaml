name: ecogrid_intelligence
description: "AI-Driven Climate Resilience Analysis for Global Energy Infrastructure on Liquid Galaxy"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # Dependency Injection
  get_it: ^8.0.3

  # Networking
  dio: ^5.8.0+1
  
  # Local Storage / Cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # SSH (Liquid Galaxy)
  dartssh2: ^2.9.0+2

  # Charts
  fl_chart: ^1.0.0

  # Maps
  google_maps_flutter: ^2.12.1

  google_generative_ai: any

  # TTS
  flutter_tts: ^4.2.0

  # Functional Programming
  dartz: ^0.10.1

  # CSV Parsing
  csv: ^6.0.0

  # Utilities
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  connectivity_plus: ^6.1.4
  logger: ^2.5.0
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: any
  hive_generator: any

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/


