name: ecogrid_intelligence
description: "AI-Driven Climate Resilience Analysis for Global Energy Infrastructure on Liquid Galaxy"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # State Management
  flutter_bloc: ^9.1.0
  bloc_concurrency: ^0.3.0
  equatable: ^2.0.7

  # Dependency Injection
  get_it: ^8.0.3

  # Networking
  dio: ^5.8.0+1
  chucker_flutter: ^1.9.2
  
  # Local Storage / Cache
  drift: ^2.22.0
  sqlite3_flutter_libs: ^0.5.4
  path: ^1.9.0
  flutter_secure_storage: ^9.2.4

  # SSH (Liquid Galaxy)
  dartssh2: ^2.9.0+2

  # Charts
  fl_chart: ^1.0.0

  # Maps
  google_maps_flutter: ^2.12.1

  # TTS
  flutter_tts: ^4.2.0

  # Functional Programming
  dartz: ^0.10.1

  # CSV Parsing
  csv: ^6.0.0

  # Utilities
  path_provider: ^2.1.6
  url_launcher: ^6.3.1
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  connectivity_plus: ^6.1.4
  logger: ^2.5.0
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  uuid: ^4.5.1
  flutter_dotenv: ^6.0.1
  shared_preferences: ^2.5.5
  speech_to_text: ^7.4.0
  lucide_icons_flutter: ^3.1.14+2
  fluentui_system_icons: ^1.1.273

  package_info_plus: ^8.3.1
  material_symbols_icons: ^4.2951.0
  screenshot: ^3.0.0
  flutter_widget_from_html: ^0.17.2
  permission_handler: ^12.0.3
  showcaseview: ^5.1.0
  google_maps_flutter_android: ^2.19.12
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: any
  drift_dev: ^2.22.0
  flutter_launcher_icons: ^0.13.1
  change_app_package_name: ^1.5.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_logo_padded.png"
  adaptive_icon_background: "#090C0F"
  adaptive_icon_foreground: "assets/images/app_logo_padded.png"
  min_sdk_android: 21

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/regions/dark/india.png
    - assets/images/regions/dark/italy.png
    - assets/images/regions/dark/usa.png
    - assets/images/regions/dark/china.png
    - assets/images/regions/dark/kenya.png
    - assets/images/regions/dark/spain.png
    - assets/images/regions/light/india.png
    - assets/images/regions/light/italy.png
    - assets/images/regions/light/usa.png
    - assets/images/regions/light/china.png
    - assets/images/regions/light/kenya.png
    - assets/images/regions/light/spain.png
    - assets/maps/style/
    - assets/maps/theme/
    - assets/data/


